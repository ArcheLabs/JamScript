[workspace]
resolver = "2"
members = [
  "crates/service-state-plane",
  "crates/service-runtime-core",
  "crates/service-runtime-state",
  "crates/service-runtime-guest",
  "crates/service-runtime-host",
  "crates/jamscript-crypto",
  "crates/jamscript-ir",
  "crates/jamscript-codec",
  "crates/jamscript-parser",
  "crates/jamscript-protocol",
  "crates/jamscript-runtime",
  "crates/jamscript-runtime-core",
  "crates/jamscript-codegen-rust",
  "crates/jamscript-backend-scriptc",
  "crates/jamscript-runtime-scriptc",
  "crates/jamscript-target-minijam",
  "crates/jamscript-toolchain",
  "crates/service-build-polkavm",
  "crates/jamscript-cli",
  "examples/rust-managed-state",
  "tools/managed-state-network-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
blake2b_simd = { version = "1.0.4", default-features = false }
polkavm-linker = "=0.30.0"
clap = { version = "4.5.45", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
schnorrkel = { version = "0.11.5", default-features = false }
swc_common = "14.0.4"
swc_ecma_ast = "15.0.0"
swc_ecma_parser = "24.0.1"
thiserror = { version = "2.0.17", default-features = false }
toml = "0.9.5"
tempfile = "3.23.0"
tar = "0.4.44"
zstd = "0.13.3"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
