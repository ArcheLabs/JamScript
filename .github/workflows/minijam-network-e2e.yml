name: MiniJAM Network E2E

on:
  workflow_dispatch:

# This is a downstream compatibility check. It is deliberately manual so that
# the JamScript build and release gates never require a MiniJAM or Jambda
# checkout.

jobs:
  network-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: JamScript

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-20 lld-20

      - name: Run real network E2E against published MiniJAM containers
        working-directory: JamScript
        env:
          CI: "true"
        run: ./scripts/minijam-network-e2e.sh
