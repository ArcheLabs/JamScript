name: MiniJAM Network E2E

on:
  push:
    branches:
      - codex/network-boundary-refactor
  workflow_dispatch:

# This downstream compatibility check stays separate from core CI and release
# jobs. Run it automatically for the network-boundary candidate branch and
# manually for other revisions; JamScript builds do not depend on MiniJAM.

jobs:
  network-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang-20
      CXX: clang++-20
      LIBCLANG_PATH: /usr/lib/llvm-20/lib
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-20
    steps:
      - uses: actions/checkout@v4
        with:
          path: JamScript

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install locked ScriptC packages
        working-directory: JamScript/toolchains/scriptc
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-20 lld-20 libclang-20-dev llvm-20-dev

      - name: Run real network E2E against published MiniJAM containers
        working-directory: JamScript
        env:
          CI: "true"
        run: ./scripts/minijam-network-e2e.sh
