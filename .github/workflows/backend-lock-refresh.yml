name: Backend lock refresh

on:
  push:
    branches:
      - codex/jamscript-backend-multiservice-v1
    paths:
      - Cargo.toml
      - crates/jamscript-service-backend/Cargo.toml
      - .github/workflows/backend-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "backend: refresh workspace lockfile"
          git push
