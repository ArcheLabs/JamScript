name: CI

on:
  push:
  pull_request:

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: bash -n scripts/test-installer.sh
      - run: ./scripts/test-installer.sh

  toolchain-distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
      - name: Install distribution check tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: ./scripts/check-toolchain-distribution.sh

  stage1-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-stage1-boundary.sh

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src, rustfmt, clippy
      - name: Install workspace native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            llvm-dev \
            pkg-config
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  contributor-cold-guest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src
      - name: Install contributor build prerequisites
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils
      - name: Install locked ScriptC packages
        working-directory: toolchains/scriptc
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bootstrap locked LLVM for contributor JAM target
        shell: bash
        run: |
          set -euo pipefail
          llvm_out="${RUNNER_TEMP}/jamscript-llvm"
          ./tools/release/toolchain/bootstrap-llvm-linux.sh "${llvm_out}"
          set -a
          source "${llvm_out}/llvm.env"
          set +a
          ./tools/release/toolchain/verify-llvm-linux.sh "${LLVM_ROOT}"
          cat "${llvm_out}/llvm.env" >> "${GITHUB_ENV}"
          echo "${LLVM_ROOT}/bin" >> "${GITHUB_PATH}"
          if [[ -x "${LLVM_ROOT}/bin/llvm-readelf" ]]; then
            echo "JAMSCRIPT_READELF=${LLVM_ROOT}/bin/llvm-readelf" >> "${GITHUB_ENV}"
          fi
      - run: ./scripts/test-contributor-cold-guest.sh

  typescript-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - working-directory: packages/client
        run: npm ci
      - working-directory: packages/client
        run: npm run build
      - working-directory: packages/client
        run: npm test

  release-producer-smoke:
    name: Release producer smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            setup: setup-host-build-env-linux.sh
          - platform: macos-arm64
            os: macos-15
            setup: setup-host-build-env-macos.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: toolchains/scriptc/NODE_VERSION
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src
      - name: Set up the exact host build environment
        shell: bash
        run: |
          set -euo pipefail
          ./tools/release/${{ matrix.setup }} "${RUNNER_TEMP}/host.env"
          grep -q '^LLVM_CONFIG_PATH=' "${RUNNER_TEMP}/host.env"
          grep -q '^LIBCLANG_PATH=' "${RUNNER_TEMP}/host.env"
          ! grep -q '^DYLD_LIBRARY_PATH=' "${RUNNER_TEMP}/host.env"
          ! grep -q '^DYLD_FALLBACK_LIBRARY_PATH=' "${RUNNER_TEMP}/host.env"
          ! grep -q '^LD_LIBRARY_PATH=' "${RUNNER_TEMP}/host.env"
      - name: Verify host environment isolation
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DYLD_LIBRARY_PATH:-}"
          test -z "${DYLD_FALLBACK_LIBRARY_PATH:-}"
          test -z "${LD_LIBRARY_PATH:-}"
          node --version
          git --version
          cargo --version
          echo "GLOBAL_LD_LIBRARY_PATH=ABSENT"
          echo "GLOBAL_DYLD_LIBRARY_PATH=ABSENT"
          echo "GLOBAL_DYLD_FALLBACK_LIBRARY_PATH=ABSENT"
          echo "NODE_AFTER_HOST_SETUP=PASS"
          echo "GIT_AFTER_HOST_SETUP=PASS"
          echo "HOST_ENVIRONMENT_ISOLATION=PASS"
      - name: Verify macOS system tools remain uncontaminated
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DYLD_LIBRARY_PATH:-}"
          test -z "${DYLD_FALLBACK_LIBRARY_PATH:-}"
          node --version
          git --version
          for system_tool in node git; do
            if otool -L "$(command -v "${system_tool}")" | grep -qi 'jamscript-llvm\|LLVM-20.1.8'; then
              echo "SYSTEM_${system_tool}_LLVM_CONTAMINATION=FAIL" >&2
              exit 1
            fi
          done
          echo "MACOS_GLOBAL_DYLD_OVERRIDE=ABSENT"
          echo "SYSTEM_NODE_NOT_CONTAMINATED=PASS"
          echo "SYSTEM_GIT_NOT_CONTAMINATED=PASS"
      - name: Build the CLI and backend producer artifacts
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "${RUNNER_TEMP}/host.env"
          set +a
          host_rustflags="${RUSTFLAGS:-} ${JAMSCRIPT_HOST_RPATH_FLAG}"
          ./scripts/release/check-release-source.sh --platform "${{ matrix.platform }}"
          version="v${{ github.run_number }}.0.0-rc.1"
          RUSTFLAGS="${host_rustflags}" cargo build --release --locked --bin jams
          test -x target/release/jams
          echo "JAMS_BUILD=PASS"
          RUSTFLAGS="${host_rustflags}" \
            JAMSCRIPT_BACKEND_TARGET="${{ matrix.platform }}" \
            ./tools/release/build-backend-artifact.sh "${RUNNER_TEMP}/backend" "${version}"
          test -f "${RUNNER_TEMP}/backend/jamscript-backend-${version}-${{ matrix.platform }}.tar.gz"
          echo "BACKEND_BUILD=PASS"
          echo "RELEASE_PRODUCER_SMOKE=${{ matrix.platform }}:PASS"
