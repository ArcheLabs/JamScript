name: Release Backend

on:
  workflow_dispatch:
    inputs:
      version:
        description: backend-v0.1.0-rc.1 or backend-v0.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  TZ: UTC
  LANG: C
  LC_ALL: C

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
      image_version: ${{ steps.identity.outputs.image_version }}
    steps:
      - name: Checkout the dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Validate main source identity and backend version
        id: identity
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          source_sha="$(git rev-parse HEAD)"
          test "${source_sha}" = "${GITHUB_SHA}"
          ./tools/release/validate-backend-release-version.sh "${VERSION}"
          tag_sha="$(git ls-remote origin "refs/tags/${VERSION}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${tag_sha}" ]]; then
            tag_sha="$(git ls-remote origin "refs/tags/${VERSION}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "${tag_sha}" ]]; then
            test "${tag_sha}" = "${source_sha}" || {
              echo "backend tag already points at a different source: ${VERSION}" >&2
              exit 1
            }
            echo "BACKEND_RELEASE_TAG=EXISTING_EXACT"
          else
            echo "BACKEND_RELEASE_TAG=AVAILABLE"
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "BACKEND_RELEASE_OBJECT=EXISTING"
          else
            echo "BACKEND_RELEASE_OBJECT=AVAILABLE"
          fi
          ci_runs="$(gh run list \
            --workflow ci.yml \
            --commit "${source_sha}" \
            --event push \
            --limit 20 \
            --json databaseId,status,conclusion,headSha,event,createdAt)"
          if ! jq -e --arg sha "${source_sha}" \
            'any(.[]; .headSha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")' \
            <<<"${ci_runs}" >/dev/null; then
            echo "no successful source CI push run exists for ${source_sha}" >&2
            echo "BACKEND_SOURCE_CI_STATUS=FAIL" >&2
            exit 1
          fi
          echo "BACKEND_SOURCE_CI_STATUS=PASS"
          consumer_runs="$(gh run list \
            --workflow minijam-network-e2e.yml \
            --commit "${source_sha}" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,status,conclusion,headSha,event,createdAt)"
          if ! jq -e --arg sha "${source_sha}" \
            'any(.[]; .headSha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")' \
            <<<"${consumer_runs}" >/dev/null; then
            echo "no successful canonical MiniJAM E2E exists for ${source_sha}" >&2
            echo "BACKEND_MINIJAM_E2E=FAIL" >&2
            exit 1
          fi
          consumer_run_id="$(jq -r --arg sha "${source_sha}" \
            '.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success") | .databaseId' \
            <<<"${consumer_runs}" | head -n 1)"
          echo "BACKEND_MINIJAM_E2E=PASS"
          echo "BACKEND_MINIJAM_E2E_RUN_ID=${consumer_run_id}"
          {
            echo "source_sha=${source_sha}"
            echo "version=${VERSION}"
            echo "image_version=${VERSION#backend-}"
          } >> "${GITHUB_OUTPUT}"
          echo "BACKEND_SOURCE_SHA=${source_sha}"

  build-backend:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            setup: setup-host-build-env-linux.sh
          - platform: macos-arm64
            os: macos-15
            setup: setup-host-build-env-macos.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
      - name: Set up the canonical host environment
        shell: bash
        run: |
          set -euo pipefail
          ./tools/release/${{ matrix.setup }} "${RUNNER_TEMP}/host.env"
          grep -q '^LLVM_CONFIG_PATH=' "${RUNNER_TEMP}/host.env"
          grep -q '^LIBCLANG_PATH=' "${RUNNER_TEMP}/host.env"
          ! grep -q '^DYLD_LIBRARY_PATH=' "${RUNNER_TEMP}/host.env"
          ! grep -q '^DYLD_FALLBACK_LIBRARY_PATH=' "${RUNNER_TEMP}/host.env"
          ! grep -q '^LD_LIBRARY_PATH=' "${RUNNER_TEMP}/host.env"
      - name: Build the native backend artifact
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "${RUNNER_TEMP}/host.env"
          set +a
          host_rustflags="${RUSTFLAGS:-} ${JAMSCRIPT_HOST_RPATH_FLAG}"
          RUSTFLAGS="${host_rustflags}" \
            JAMSCRIPT_BACKEND_TARGET="${{ matrix.platform }}" \
            ./tools/release/build-backend-artifact.sh "${RUNNER_TEMP}/backend" "${VERSION}"
          test -f "${RUNNER_TEMP}/backend/jamscript-backend-${VERSION#backend-}-${{ matrix.platform }}.tar.gz"
          echo "BACKEND_NATIVE_BUILD=${{ matrix.platform }}:PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-input-backend-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/backend/jamscript-backend-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  native-smoke:
    needs: [validate, build-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: release-input-backend-${{ matrix.platform }}
          path: ${{ runner.temp }}/backend-input
      - name: Verify source and run the native backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          context="${RUNNER_TEMP}/backend"
          mkdir -p "${context}"
          tar -xzf "${RUNNER_TEMP}/backend-input/jamscript-backend-${VERSION#backend-}-${{ matrix.platform }}.tar.gz" -C "${context}"
          ./scripts/release/backend-native-smoke.sh "${context}/bin/jamscript-service-backend"

  assemble-backend:
    needs: [validate, build-backend, native-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-input-backend-*
          path: ${{ runner.temp }}/backend-assets
          merge-multiple: true
      - name: Write backend manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/backend-assets"
          python3 ./tools/release/write-backend-manifest.py \
            --output "${assets}/backend-manifest.json" \
            --backend-version "${VERSION}" \
            --source-commit "${SOURCE_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --target linux-x86_64 \
            --artifact "${assets}/jamscript-backend-${VERSION#backend-}-linux-x86_64.tar.gz" \
            --target macos-arm64 \
            --artifact "${assets}/jamscript-backend-${VERSION#backend-}-macos-arm64.tar.gz"
          (cd "${assets}" && sha256sum -- * > SHA256SUMS)
          jq -e '.backendVersion == $version and (.targets | length == 2) and .protocol.formalRpc == "v1"' \
            --arg version "${VERSION#backend-v}" "${assets}/backend-manifest.json"
          echo "BACKEND_ASSEMBLY=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-backend-assets
          path: ${{ runner.temp }}/backend-assets
          if-no-files-found: error
          retention-days: 7

  docker-prepublish:
    needs: [validate, assemble-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: assembled-backend-assets
          path: ${{ runner.temp }}/backend-assets
      - name: Build and smoke the exact backend artifact image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          context="${RUNNER_TEMP}/backend-image-context"
          mkdir -p "${context}"
          tar -xzf "${RUNNER_TEMP}/backend-assets/jamscript-backend-${VERSION#backend-}-linux-x86_64.tar.gz" -C "${context}"
          cp Dockerfile.backend.runtime "${context}/Dockerfile"
          docker build -f "${context}/Dockerfile" -t "jamscript-backend:prepublish-${GITHUB_RUN_ID}" "${context}"
          ./scripts/release/backend-container-smoke.sh "jamscript-backend:prepublish-${GITHUB_RUN_ID}"
          echo "BACKEND_DOCKER_PREPUBLISH=PASS"

  publish-backend-release:
    needs: [validate, assemble-backend, docker-prepublish]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE_VERSION: ${{ needs.validate.outputs.image_version }}
    steps:
      - name: Checkout the exact backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: assembled-backend-assets
          path: ${{ runner.temp }}/backend-assets
      - name: Create the exact backend source tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          remote_tag_sha="$(git ls-remote origin "refs/tags/${VERSION}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${remote_tag_sha}" ]]; then
            remote_tag_sha="$(git ls-remote origin "refs/tags/${VERSION}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "${remote_tag_sha}" ]]; then
            test "${remote_tag_sha}" = "${SOURCE_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" "${SOURCE_SHA}" -m "JamScript Backend ${IMAGE_VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi
          echo "BACKEND_TAG_TARGET=${SOURCE_SHA}"
      - name: Publish exact backend release and GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/backend-assets"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            remote="${RUNNER_TEMP}/existing-backend-release-assets"
            mkdir -p "${remote}"
            gh release download "${VERSION}" --dir "${remote}"
            while IFS= read -r asset; do
              cmp -s "${assets}/${asset}" "${remote}/${asset}" || {
                echo "BACKEND_IMMUTABLE_RELEASE_ASSET=FAIL ${asset}" >&2
                exit 1
              }
            done < <(cd "${assets}" && find . -maxdepth 1 -type f -printf '%f\n' | sort)
            (cd "${assets}" && find . -maxdepth 1 -type f -printf '%f\n' | sort) > "${RUNNER_TEMP}/expected-backend-assets.txt"
            (cd "${remote}" && find . -maxdepth 1 -type f -printf '%f\n' | sort) > "${RUNNER_TEMP}/actual-backend-assets.txt"
            cmp -s "${RUNNER_TEMP}/expected-backend-assets.txt" "${RUNNER_TEMP}/actual-backend-assets.txt"
            (cd "${remote}" && sha256sum -c SHA256SUMS)
            echo "BACKEND_GITHUB_RELEASE=PASS (existing bytes verified)"
          else
            args=("${VERSION}" --verify-tag --target "${SOURCE_SHA}" --title "JamScript Backend ${IMAGE_VERSION}" --notes "Immutable JamScript Backend release assets for ${VERSION}.")
            [[ "${VERSION}" == *-rc.* ]] && args+=(--prerelease --latest=false)
            gh release create "${args[@]}" "${assets}"/*
            echo "BACKEND_GITHUB_RELEASE=PASS"
          fi
          context="${RUNNER_TEMP}/backend-image-context"
          mkdir -p "${context}"
          tar -xzf "${assets}/jamscript-backend-${VERSION#backend-}-linux-x86_64.tar.gz" -C "${context}"
          cp Dockerfile.backend.runtime "${context}/Dockerfile"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          image="ghcr.io/archelabs/jamscript-backend:${IMAGE_VERSION}"
          if docker manifest inspect "${image}" >/dev/null 2>&1; then
            docker pull "${image}"
            image_source="$(docker image inspect "${image}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "${image_source}" = "${SOURCE_SHA}" || {
              echo "GHCR image already exists for a different source: ${IMAGE_VERSION}" >&2
              exit 1
            }
            echo "BACKEND_GHCR_PUBLICATION=PASS (existing image verified)"
          else
            docker build -f "${context}/Dockerfile" \
              --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
              --label "org.opencontainers.image.version=${IMAGE_VERSION}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              -t "${image}" "${context}"
            docker push "${image}"
            echo "BACKEND_GHCR_PUBLICATION=PASS"
          fi

  published-image-test:
    needs: [validate, publish-backend-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      GHCR_IMAGE: ghcr.io/archelabs/jamscript-backend:${{ needs.validate.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.source_sha }}"
      - name: Pull the published backend image and verify restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${GHCR_IMAGE}"
          ./scripts/release/backend-container-smoke.sh "${GHCR_IMAGE}" 18090 "jamscript-backend-published-${GITHUB_RUN_ID}" "jamscript-backend-published-${GITHUB_RUN_ID}"
          echo "PUBLISHED_BACKEND_IMAGE=PASS"
          echo "PUBLISHED_BACKEND_VOLUME_RESTART=PASS"

  backend-release-ready:
    needs: [validate, published-image-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - name: Confirm backend release identity and final gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          gh release view "${VERSION}" >/dev/null
          tag_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}^{}" | awk 'NR == 1 { print $1 }')"
          test "${tag_sha}" = "${SOURCE_SHA}"
          echo "BACKEND_RELEASE_READY=PASS"
