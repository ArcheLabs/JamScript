name: Publish JamScript Toolchain

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new GitHub Release tag for the promoted bundle
        required: true
        default: toolchain-scriptc-m2-v1

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src
      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y zstd patchelf jq curl xz-utils
      - name: Bootstrap exact LLVM distribution
        run: |
          llvm_out="$RUNNER_TEMP/jamscript-llvm"
          ./tools/release/toolchain/bootstrap-llvm-linux.sh "$llvm_out"
          cat "$llvm_out/llvm.env" >> "$GITHUB_ENV"
      - name: Build deterministic bundle
        env:
          JAMSCRIPT_TOOLCHAIN_RELEASE_ENGINEERING: "1"
        run: |
          export SCRIPTC_NODE="$(command -v node)"
          ./tools/release/toolchain/build-linux.sh "$RUNNER_TEMP/toolchain"
          ./tools/release/toolchain/verify-bundle.sh "$RUNNER_TEMP/toolchain/jamscript-toolchain-scriptc-m2-v1-linux-x86_64.tar.zst"
      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "JamScript Toolchain $RELEASE_TAG" --notes "Managed JamScript compiler distribution."
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/toolchain/jamscript-toolchain-scriptc-m2-v1-linux-x86_64.tar.zst" \
            "$RUNNER_TEMP/toolchain/toolchain-manifest.json" --clobber
