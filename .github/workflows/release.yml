name: Release JamScript

on:
  workflow_dispatch:
    inputs:
      version:
        description: v0.1.0-rc.6 or v0.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  TZ: UTC
  LANG: C
  LC_ALL: C
  JAMSCRIPT_TOOLCHAIN_RELEASE_ENGINEERING: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout the dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Validate source, version, tag, and release identity
        id: identity
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          source_sha="$(git rev-parse HEAD)"
          test "${source_sha}" = "${GITHUB_SHA}"
          ./tools/release/validate-release-version.sh "${VERSION}"
          tag_sha="$(git ls-remote origin "refs/tags/${VERSION}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${tag_sha}" ]]; then
            tag_sha="$(git ls-remote origin "refs/tags/${VERSION}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "${tag_sha}" ]]; then
            test "${tag_sha}" = "${source_sha}" || {
              echo "release tag already points at a different source: ${VERSION}" >&2
              exit 1
            }
            echo "RELEASE_TAG=EXISTING_EXACT"
          else
            echo "RELEASE_TAG=AVAILABLE"
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for ${VERSION}; publish is immutable and will not replace it" >&2
            exit 1
          fi
          ci_runs="$(gh run list \
            --workflow ci.yml \
            --commit "${source_sha}" \
            --event push \
            --limit 20 \
            --json databaseId,status,conclusion,headSha,event,createdAt)"
          if ! jq -e --arg sha "${source_sha}" \
            'any(.[]; .headSha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")' \
            <<<"${ci_runs}" >/dev/null; then
            echo "no successful CI push run exists for ${source_sha}" >&2
            jq -r '.[] | [.databaseId, .status, (.conclusion // ""), .event, .headSha, .createdAt] | @tsv' \
              <<<"${ci_runs}" >&2
            echo "SOURCE_CI_STATUS=FAIL" >&2
            exit 1
          fi
          ci_run_id="$(jq -r --arg sha "${source_sha}" \
            '.[] | select(.headSha == $sha and .event == "push" and .status == "completed" and .conclusion == "success") | .databaseId' \
            <<<"${ci_runs}" | head -n 1)"
          echo "SOURCE_CI_STATUS=PASS"
          echo "SOURCE_CI_RUN_ID=${ci_run_id}"
          consumer_runs="$(gh run list \
            --workflow minijam-network-e2e.yml \
            --commit "${source_sha}" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,status,conclusion,headSha,event,createdAt)"
          if ! jq -e --arg sha "${source_sha}" \
            'any(.[]; .headSha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")' \
            <<<"${consumer_runs}" >/dev/null; then
            echo "no successful canonical MiniJAM consumer E2E exists for ${source_sha}" >&2
            jq -r '.[] | [.databaseId, .status, (.conclusion // ""), .event, .headSha, .createdAt] | @tsv' \
              <<<"${consumer_runs}" >&2
            echo "JAMSCRIPT_CANONICAL_MINIJAM_E2E=FAIL" >&2
            exit 1
          fi
          consumer_run_id="$(jq -r --arg sha "${source_sha}" \
            '.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success") | .databaseId' \
            <<<"${consumer_runs}" | head -n 1)"
          echo "JAMSCRIPT_CANONICAL_MINIJAM_E2E=PASS"
          echo "JAMSCRIPT_CANONICAL_MINIJAM_E2E_RUN_ID=${consumer_run_id}"
          {
            echo "source_sha=${source_sha}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VALIDATE=PASS"

  build-toolchain:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            setup: setup-host-build-env-linux.sh
            build: build-linux.sh
            archive: jamscript-toolchain-scriptc-m2-v1-linux-x86_64.tar.zst
          - platform: macos-arm64
            os: macos-15
            setup: setup-host-build-env-macos.sh
            build: build-macos.sh
            archive: jamscript-toolchain-scriptc-m2-v1-macos-arm64.tar.zst
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: toolchains/scriptc/NODE_VERSION
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src
      - name: Install locked ScriptC packages
        working-directory: toolchains/scriptc
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up the canonical host build environment
        shell: bash
        run: |
          set -euo pipefail
          ./tools/release/${{ matrix.setup }} "${RUNNER_TEMP}/host.env"
          set -a
          source "${RUNNER_TEMP}/host.env"
          set +a
          test -x "${JAMSCRIPT_CLANG}"
          test -x "${JAMSCRIPT_LLVM_AR}"
          test -x "${JAMSCRIPT_LLVM_LD}"
      - name: Build one toolchain archive
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "${RUNNER_TEMP}/host.env"
          set +a
          out="${RUNNER_TEMP}/toolchain"
          mkdir -p "${out}"
          SCRIPTC_NODE="$(command -v node)" \
            ./tools/release/toolchain/${{ matrix.build }} "${out}"
          bundle="${out}/${{ matrix.archive }}"
          test -s "${bundle}"
          zstd -q -t "${bundle}"
          listing="${RUNNER_TEMP}/toolchain-members.txt"
          zstd -q -d -c "${bundle}" | tar -tf - > "${listing}"
          for required in bin/node bin/clang bin/rustc bin/cargo scriptc runtime targets/jam/sdk; do
            grep -Eq "(^|/)${required}(/|$)" "${listing}"
          done
          echo "TOOLCHAIN_${{ matrix.platform == 'linux-x86_64' && 'LINUX' || 'MACOS' }}_BUILT=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-input-toolchain-${{ matrix.platform }}
          path: ${{ runner.temp }}/toolchain/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  build-cli:
    needs: [validate, build-toolchain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            setup: setup-host-build-env-linux.sh
          - platform: macos-arm64
            os: macos-15
            setup: setup-host-build-env-macos.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          submodules: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: toolchains/scriptc/NODE_VERSION
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
      - uses: actions/download-artifact@v4
        with:
          pattern: release-input-toolchain-*
          path: ${{ runner.temp }}/inputs
          merge-multiple: true
      - name: Set up the canonical host build environment
        shell: bash
        run: |
          set -euo pipefail
          ./tools/release/${{ matrix.setup }} "${RUNNER_TEMP}/host.env"
          set -a
          source "${RUNNER_TEMP}/host.env"
          set +a
          test -x "${JAMSCRIPT_CLANG}"
          test -x "${JAMSCRIPT_LLVM_AR}"
          test -x "${JAMSCRIPT_LLVM_LD}"
      - name: Build the CLI once from the exact source
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "${RUNNER_TEMP}/host.env"
          set +a
          host_rustflags="${RUSTFLAGS:-} ${JAMSCRIPT_HOST_RPATH_FLAG}"
          source_copy="${RUNNER_TEMP}/release-source"
          mkdir -p "${source_copy}"
          git archive --format=tar "${SOURCE_SHA}" | tar -xf - -C "${source_copy}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          for platform in linux-x86_64 macos-arm64; do
            bundle="${RUNNER_TEMP}/inputs/jamscript-toolchain-scriptc-m2-v1-${platform}.tar.zst"
            if command -v sha256sum >/dev/null 2>&1; then
              sha="$(sha256sum "${bundle}" | awk '{print $1}')"
            else
              sha="$(shasum -a 256 "${bundle}" | awk '{print $1}')"
            fi
            size="$(python3 -c 'import os, sys; print(os.path.getsize(sys.argv[1]))' "${bundle}")"
            python3 ./tools/release/toolchain/make-candidate-manifest.py \
              --input "${source_copy}/toolchains/distribution-v1.toml" \
              --output "${source_copy}/toolchains/distribution-v1.toml" \
              --platform "${platform}" \
              --url "${release_url}/${bundle##*/}" \
              --sha256 "${sha}" \
              --size "${size}"
          done
          RUSTFLAGS="${host_rustflags}" \
            ./tools/release/build-cli-archive.sh \
              "${source_copy}" "${RUNNER_TEMP}/cli" "${VERSION}" "${{ matrix.platform }}"
          archive="${RUNNER_TEMP}/cli/jamscript-${VERSION}-${{ matrix.platform }}.tar.gz"
          test -s "${archive}"
          tar -tzf "${archive}" >/dev/null
          cli_check="${RUNNER_TEMP}/cli-check"
          rm -rf -- "${cli_check}"
          mkdir -p "${cli_check}"
          tar -xzf "${archive}" -C "${cli_check}"
          test -x "${cli_check}/jams"
          test -f "${cli_check}/LICENSE"
          test -f "${cli_check}/README.md"
          test "$(find "${cli_check}" -maxdepth 1 -type f -name 'jamscript-service-*' | wc -l | tr -d ' ')" -eq 0
          "${cli_check}/jams" --version
          "${cli_check}/jams" --help >/dev/null
          echo "CLI_${{ matrix.platform == 'linux-x86_64' && 'LINUX' || 'MACOS' }}_BUILT=PASS"
      - name: Validate released Ownership consumer topology
        shell: bash
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/ownership-assets"
          rm -rf -- "${assets}"
          mkdir -p "${assets}"
          cli_asset="jamscript-${VERSION}-${{ matrix.platform }}.tar.gz"
          toolchain_asset="jamscript-toolchain-scriptc-m2-v1-${{ matrix.platform }}.tar.zst"
          cp -L "${RUNNER_TEMP}/cli/${cli_asset}" "${assets}/${cli_asset}"
          cp -L "${RUNNER_TEMP}/inputs/${toolchain_asset}" "${assets}/${toolchain_asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${assets}" && sha256sum -- "${cli_asset}" "${toolchain_asset}" > SHA256SUMS)
          else
            (cd "${assets}" && shasum -a 256 -- "${cli_asset}" "${toolchain_asset}" > SHA256SUMS)
          fi
          result="${RUNNER_TEMP}/ownership-consumer-${{ matrix.platform }}.json"
          ./scripts/release/ownership-consumer-closure.sh \
            --asset-dir "${assets}" \
            --release-version "${VERSION}" \
            --target "${{ matrix.platform }}" \
            --fixture-dir "${GITHUB_WORKSPACE}/tests/release-consumer-ownership" \
            --result-json "${result}" \
            --work-dir "${RUNNER_TEMP}/ownership-consumer-${{ matrix.platform }}-work"
          jq -e '.status == "PASS" and .offline_build == true and .execution == true' "${result}"
          echo "JAMSCRIPT_OWNERSHIP_CONSUMER_CHECK=PASS"
          echo "JAMSCRIPT_OWNERSHIP_CONSUMER_ABI=PASS"
          echo "JAMSCRIPT_OWNERSHIP_CONSUMER_BUILD=PASS"
          echo "JAMSCRIPT_OWNERSHIP_KEY_PARITY=PASS"
          npm --prefix packages/client ci --ignore-scripts --no-audit --no-fund
          node --test packages/client/test/ownership-v1.test.mjs
          echo "JAMSCRIPT_OWNERSHIP_CODEC_PARITY=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-input-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/cli/jamscript-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build-toolchain, build-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-input-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Verify the exact public asset set and create checksums
        shell: bash
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/release-assets"
          expected=(
            "jamscript-${VERSION}-linux-x86_64.tar.gz"
            "jamscript-${VERSION}-macos-arm64.tar.gz"
            "jamscript-toolchain-scriptc-m2-v1-linux-x86_64.tar.zst"
            "jamscript-toolchain-scriptc-m2-v1-macos-arm64.tar.zst"
          )
          for asset in "${expected[@]}"; do
            test -s "${assets}/${asset}"
          done
          actual_count="$(find "${assets}" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "${actual_count}" -eq 4
          (cd "${assets}" && sha256sum -- "${expected[@]}" > SHA256SUMS)
          test "$(find "${assets}" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          echo "SHA256SUMS_CREATED=PASS"
      - name: Create the exact source tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          remote_tag_sha="$(git ls-remote origin "refs/tags/${VERSION}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${remote_tag_sha}" ]]; then
            remote_tag_sha="$(git ls-remote origin "refs/tags/${VERSION}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "${remote_tag_sha}" ]]; then
            test "${remote_tag_sha}" = "${SOURCE_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" "${SOURCE_SHA}" -m "JamScript ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi
          echo "TAG_CREATED=PASS"
      - name: Publish the exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/release-assets"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${VERSION}; refusing to replace immutable bytes" >&2
            exit 1
          fi
          args=("${VERSION}" --verify-tag --target "${SOURCE_SHA}" --title "JamScript ${VERSION}" --notes "Immutable JamScript release assets for ${VERSION}.")
          [[ "${VERSION}" == *-rc.* ]] && args+=(--prerelease --latest=false)
          gh release create "${args[@]}" "${assets}"/*
          echo "GITHUB_RELEASE_CREATED=PASS"
          echo "SOURCE_SHA=${SOURCE_SHA}"
          echo "RELEASE_VERSION=${VERSION}"
          echo "TOOLCHAIN_LINUX_BUILT=PASS"
          echo "TOOLCHAIN_MACOS_BUILT=PASS"
          echo "CLI_LINUX_BUILT=PASS"
          echo "CLI_MACOS_BUILT=PASS"
          echo "JAMSCRIPT_RELEASE_PUBLISHED=PASS"
