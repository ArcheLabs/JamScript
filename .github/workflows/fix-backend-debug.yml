name: Fix backend Debug derive

on:
  push:
    branches:
      - codex/jamscript-backend-multiservice-v1
    paths:
      - .github/workflows/fix-backend-debug.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rustfmt, clippy
      - name: Fix BackendState derives
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/jamscript-service-backend/src/lib.rs")
          text = path.read_text()
          old_derive = "#[derive(Clone, Debug)]\npub struct BackendState {"
          new_derive = "#[derive(Clone, Default)]\npub struct BackendState {"
          old_default = '''impl Default for BackendState {
              fn default() -> Self {
                  Self {
                      registry: ServiceRegistry::default(),
                      provider: FullStateProvider::default(),
                      pending: BTreeMap::new(),
                      predictions: BTreeMap::new(),
                  }
              }
          }

          '''
          if old_derive not in text:
              raise SystemExit("target BackendState derive not found")
          if old_default not in text:
              raise SystemExit("manual BackendState Default impl not found")
          text = text.replace(old_derive, new_derive, 1)
          text = text.replace(old_default, "", 1)
          path.write_text(text)
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/jamscript-service-backend/src/lib.rs
          git commit -m "fix: derive BackendState without Debug"
          git push
