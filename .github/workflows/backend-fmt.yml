name: Backend format

on:
  push:
    branches:
      - codex/jamscript-backend-multiservice-v1
    paths:
      - .github/workflows/backend-fmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rustfmt
      - run: cargo fmt --all
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/jamscript-service-backend/src/lib.rs
          git commit -m "backend: format multi-service core"
          git push
