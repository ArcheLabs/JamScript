name: Temporary backend Clippy cleanup

on:
  push:
    branches:
      - codex/ci-workflow-consolidation-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ci-workflow-consolidation-20260917
          fetch-depth: 0

      - name: Apply exact Clippy suggestions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/jamscript-service-backend/src/lib.rs")
          text = path.read_text()

          marker = "struct TransactionCoordinatorState {"
          if text.count(marker) != 1:
              raise SystemExit(f"unexpected TransactionCoordinatorState count: {text.count(marker)}")
          text = text.replace(marker, "#[derive(Default)]\n" + marker, 1)

          impl_start = "\nimpl Default for TransactionCoordinatorState {"
          impl_end = "\n\nstruct BatchToSubmit {"
          start = text.find(impl_start)
          if start < 0:
              raise SystemExit("manual TransactionCoordinatorState Default impl not found")
          end = text.find(impl_end, start)
          if end < 0:
              raise SystemExit("BatchToSubmit marker not found after Default impl")
          text = text[:start] + text[end:]

          old_assert = '''assert_eq!(
                      coordinator
                          .take_ready_batch(7, &BTreeMap::new())
                          .unwrap()
                          .is_none(),
                      true
                  );'''
          new_assert = '''assert!(
                      coordinator
                          .take_ready_batch(7, &BTreeMap::new())
                          .unwrap()
                          .is_none()
                  );'''
          count = text.count(old_assert)
          if count != 3:
              raise SystemExit(f"unexpected bool assertion count: {count}")
          text = text.replace(old_assert, new_assert)

          path.write_text(text)
          PY

          rm -f .github/workflows/_temp-apply-backend-clippy-fixes.yml

          git diff --check
          git diff -- crates/jamscript-service-backend/src/lib.rs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/jamscript-service-backend/src/lib.rs .github/workflows/_temp-apply-backend-clippy-fixes.yml
          git commit -m "style(backend): apply Clippy suggestions"
          git push origin HEAD:codex/ci-workflow-consolidation-20260917
