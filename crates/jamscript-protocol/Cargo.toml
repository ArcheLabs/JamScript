[package]
name = "jamscript-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jamscript-crypto = { path = "../jamscript-crypto", default-features = false }
ownership-core = { path = "../ownership-core" }
base64.workspace = true
service-runtime-core = { path = "../service-runtime-core", default-features = false }
thiserror.workspace = true

[features]
default = []

[dev-dependencies]
ed25519-dalek.workspace = true
jamscript-ir = { path = "../jamscript-ir" }
schnorrkel.workspace = true

# SignedAction constructors intentionally mirror the protocol envelope fields.
# Keeping this lint local avoids a public API reshuffle solely for Clippy.
[lints.clippy]
too_many_arguments = "allow"
